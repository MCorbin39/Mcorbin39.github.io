```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indianapolis Slippi Rankings</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">

    <div class="top-controls">
      <button class="action-button" id="addUserBtn">
        Add User Here
      </button>

      <div class="site-title">
        An automatic hub of Indianapolis<br />
        Melee's Online Rankings
      </div>

      <button class="action-button" id="deleteUserBtn">
        Delete User Here
      </button>
    </div>

    <section class="rankings-container">
      <div class="rankings-header">
        <span class="collapse-icon">−</span>
        <strong>Indianapolis Slippi Rankings</strong>
      </div>

      <div class="rankings-column-labels">
        <div></div>
        <div>Tag</div>
        <div>Points</div>
      </div>

      <div id="rankingsList">

      </div>
    </section>

  </main>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>Add User</h2>

      <label for="addTag">Tag</label>
      <input
        type="text"
        id="addTag"
        placeholder="Enter player tag"
        maxlength="30"
      />

      <label for="addPoints">Total # of online Slippi points</label>
      <input
        type="number"
        id="addPoints"
        placeholder="Enter points"
        min="0"
        step="1"
      />

      <p class="error-message" id="addError"></p>

      <div class="modal-buttons">
        <button class="modal-button" id="confirmAddBtn">
          Add User
        </button>

        <button class="modal-button cancel-button" id="cancelAddBtn">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h2>Delete User</h2>

      <label for="deleteTag">Tag</label>
      <input
        type="text"
        id="deleteTag"
        placeholder="Enter player tag"
        maxlength="30"
      />

      <p class="error-message" id="deleteError"></p>

      <div class="modal-buttons">
        <button class="modal-button" id="checkDeleteBtn">
          Continue
        </button>

        <button class="modal-button cancel-button" id="cancelDeleteBtn">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmDeleteModal">
    <div class="modal">
      <h2>Confirm Delete</h2>

      <p class="confirmation-text">
        Really delete user <strong id="userToDelete"></strong>?
      </p>

      <div class="modal-buttons">
        <button class="modal-button" id="yesDeleteBtn">
          Yes
        </button>

        <button class="modal-button cancel-button" id="noDeleteBtn">
          No
        </button>
      </div>
    </div>
  </div>

  <script>
    const rankingsList = document.getElementById("rankingsList");

    const addModal = document.getElementById("addModal");
    const deleteModal = document.getElementById("deleteModal");
    const confirmDeleteModal = document.getElementById("confirmDeleteModal");

    const addTag = document.getElementById("addTag");
    const addPoints = document.getElementById("addPoints");
    const deleteTag = document.getElementById("deleteTag");

    const addError = document.getElementById("addError");
    const deleteError = document.getElementById("deleteError");

    const userToDelete = document.getElementById("userToDelete");

    let users = JSON.parse(localStorage.getItem("indianapolisSlippiUsers")) || [];

    let pendingDeleteTag = "";

    function renderRankings() {
      rankingsList.innerHTML = "";

      users.sort((a, b) => b.points - a.points);

      users.forEach((user, index) => {
        const row = document.createElement("div");
        row.className = "ranking-row";

        row.innerHTML = `
          <div class="rank">#${index + 1}</div>
          <div class="player-name">${escapeHTML(user.tag)}</div>
          <div class="points">${user.points}</div>
        `;

        rankingsList.appendChild(row);
      });

      localStorage.setItem(
        "indianapolisSlippiUsers",
        JSON.stringify(users)
      );
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("addUserBtn").addEventListener("click", () => {
      addTag.value = "";
      addPoints.value = "";
      addError.textContent = "";

      addModal.classList.add("active");

      setTimeout(() => {
        addTag.focus();
      }, 100);
    });

    document.getElementById("cancelAddBtn").addEventListener("click", () => {
      addModal.classList.remove("active");
    });

    document.getElementById("confirmAddBtn").addEventListener("click", () => {
      const tag = addTag.value.trim();
      const points = Number(addPoints.value);

      addError.textContent = "";

      if (tag === "") {
        addError.textContent = "Please enter a Tag.";
        return;
      }

      if (addPoints.value === "" || !Number.isInteger(points) || points < 0) {
        addError.textContent =
          "Please enter a valid number of points.";
        return;
      }

      const existingUser = users.find(
        user => user.tag.toLowerCase() === tag.toLowerCase()
      );

      if (existingUser) {
        addError.textContent =
          "That Tag is already in the rankings.";
        return;
      }

      users.push({
        tag: tag,
        points: points
      });

      renderRankings();

      addModal.classList.remove("active");
    });

    document.getElementById("deleteUserBtn").addEventListener("click", () => {
      deleteTag.value = "";
      deleteError.textContent = "";

      deleteModal.classList.add("active");

      setTimeout(() => {
        deleteTag.focus();
      }, 100);
    });

    document.getElementById("cancelDeleteBtn").addEventListener("click", () => {
      deleteModal.classList.remove("active");
    });

    document.getElementById("checkDeleteBtn").addEventListener("click", () => {
      const tag = deleteTag.value.trim();

      deleteError.textContent = "";

      if (tag === "") {
        deleteError.textContent = "Please enter a Tag.";
        return;
      }

      const existingUser = users.find(
        user => user.tag.toLowerCase() === tag.toLowerCase()
      );

      if (!existingUser) {
        deleteError.textContent = "Tag not found.";
        return;
      }

      pendingDeleteTag = existingUser.tag;

      userToDelete.textContent = existingUser.tag;

      deleteModal.classList.remove("active");
      confirmDeleteModal.classList.add("active");
    });

    document.getElementById("yesDeleteBtn").addEventListener("click", () => {
      users = users.filter(
        user => user.tag.toLowerCase() !== pendingDeleteTag.toLowerCase()
      );

      pendingDeleteTag = "";

      renderRankings();

      confirmDeleteModal.classList.remove("active");
    });

    document.getElementById("noDeleteBtn").addEventListener("click", () => {
      pendingDeleteTag = "";

      confirmDeleteModal.classList.remove("active");
    });

    [addModal, deleteModal, confirmDeleteModal].forEach(modal => {
      modal.addEventListener("click", event => {
        if (event.target === modal) {
          modal.classList.remove("active");
        }
      });
    });

    [addTag, addPoints].forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          document.getElementById("confirmAddBtn").click();
        }
      });
    });

    deleteTag.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        document.getElementById("checkDeleteBtn").click();
      }
    });
    
  </script>
</body>
</html>
```
